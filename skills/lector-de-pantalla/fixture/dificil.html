</div></div></div></div></div></div></div></div></div></div>

<!-- svg con título -->
<svg width="80" height="40"><title>Icono de carrito</title><circle cx="20" cy="20" r="15" /></svg>

<!-- shadow dom -->
<div id="host"></div>

<!-- iframe -->
<iframe title="Mapa" srcdoc="<button>Botón dentro del iframe</button>"></iframe>

<script>
  const host = document.getElementById("host");
  const root = host.attachShadow({ mode: "open" });
  root.innerHTML = '<img src="shadow.png" alt="Imagen dentro del shadow DOM"><a href="/s">leer más</a>';
</script>
