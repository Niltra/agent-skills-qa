<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Formulario que miente</title>
<style>
  body { font: 16px/1.6 "Segoe UI", system-ui, sans-serif; max-width: 520px; margin: 48px auto; }
  label { display: block; margin-top: 16px; font-size: 14px; }
  input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #c9c2b6; }
  button { margin-top: 20px; padding: 12px 20px; background: #14110f; color: #fff; border: 0; }
  .error { color: #b3261e; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<h1>Contacto</h1>
<form id="f" novalidate>
  <input name="nombre" placeholder="Tu nombre">
  <label for="email">Email</label>
  <input id="email" name="email" type="email">
  <label for="tel">Teléfono</label>
  <input id="tel" name="tel" type="tel">
  <button type="submit">Enviar</button>
</form>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    fetch("https://example.com/api/enviar", { method: "POST", body: "{}" });
  });
</script>
</body>
</html>
